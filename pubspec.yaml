name: quran_journal
description: مع القرآن — With the Quran. A personal Quranic journal app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  google_fonts: ^6.2.1
  fl_chart: ^0.68.0
  shared_preferences: ^2.2.2
  cupertino_icons: ^1.0.6
  flutter_animate: ^4.5.0
  flutter_secure_storage: ^9.2.4
  google_sign_in: ^6.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_native_splash: ^2.4.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  fonts:
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
        - asset: assets/fonts/Amiri-Bold.ttf
          weight: 700
  assets:
    - assets/fonts/
    - assets/icon/

flutter_native_splash:
  color: "#17171E"
  color_dark: "#17171E"
  image: assets/icon/app_icon_foreground.png
  image_dark: assets/icon/app_icon_foreground.png
  web: true
  android: true
  ios: true

flutter_launcher_icons:
  android: true
  ios: true
  web:
    generate: true
    image_path: assets/icon/app_icon.png
    background_color: "#17171E"
    theme_color: "#6F54D8"
  image_path: assets/icon/app_icon.png
  adaptive_icon_background: "#17171E"
  adaptive_icon_foreground: assets/icon/app_icon_foreground.png
  adaptive_icon_foreground_inset: 8
  remove_alpha_ios: true