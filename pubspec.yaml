name: quran_journal
description: مع القرآن — With the Quran. A personal Quranic journal app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  google_fonts: ^6.2.1
  fl_chart: ^0.68.0
  shared_preferences: ^2.2.2
  cupertino_icons: ^1.0.6
  flutter_animate: ^4.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_native_splash: ^2.4.0

flutter:
  uses-material-design: true
  fonts:
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
        - asset: assets/fonts/Amiri-Bold.ttf
          weight: 700
  assets:
    - assets/fonts/

flutter_native_splash:
  color: "#17171E"
  color_dark: "#17171E"
  web: true
  android: true
  ios: true